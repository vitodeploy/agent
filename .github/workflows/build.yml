name: Build

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        go-version: ["1.21"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Build ARM64
        run: GOOS=linux GOARCH=arm64 go build -o vitoagent-linux-arm64 ./cmd/agent.go
      - name: Build ARM
        run: GOOS=linux GOARCH=arm go build -o vitoagent-linux-arm ./cmd/agent.go
      - name: Build AMD64
        run: GOOS=linux GOARCH=amd64 go build -o vitoagent-linux-amd64 ./cmd/agent.go
      - name: Build AMD
        run: GOOS=linux GOARCH=386 go build -o vitoagent-linux-amd ./cmd/agent.go
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          files: |
            vitoagent-linux-arm64
            vitoagent-linux-arm
            vitoagent-linux-amd64
            vitoagent-linux-amd
